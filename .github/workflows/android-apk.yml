
name: generar-apk-android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: descargar codigo
        uses: actions/checkout@v4

      - name: instalar flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: generar estructura android
        run: flutter create . --platforms=android

      - name: instalar dependencias
        run: flutter pub get

      - name: Verificar intermediario de catálogos para Android
        env:
          COMPARADOR_API_BASE_URL: ${{ vars.COMPARADOR_API_BASE_URL }}
        run: |
          if [ -z "$COMPARADOR_API_BASE_URL" ]; then
            echo "::error::Falta configurar la variable de repositorio COMPARADOR_API_BASE_URL con la URL del Worker desplegado."
            exit 1
          fi

      - name: compilar apk
        run: flutter build apk --release --dart-define=COMPARADOR_API_BASE_URL=${{ vars.COMPARADOR_API_BASE_URL }}

      - name: guardar apk
        uses: actions/upload-artifact@v4
        with:
          name: comparador-inteligente-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
