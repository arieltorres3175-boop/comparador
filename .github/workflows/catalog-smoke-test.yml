name: diagnostico-catalogos-supermercados

on:
  push:
    branches:
      - feat/buscador-supermercados-mvp
    paths:
      - 'tools/catalog-smoke-test.mjs'
      - '.github/workflows/catalog-smoke-test.yml'
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Producto de prueba (por ejemplo: leche)'
        required: false
        default: 'leche'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/catalog-smoke-test.mjs'
      - '.github/workflows/catalog-smoke-test.yml'

permissions:
  contents: read

jobs:
  check-public-catalogs:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar una muestra pequeña de cada catálogo VTEX
        env:
          SEARCH_QUERY: ${{ github.event.inputs.search_query || 'leche' }}
        run: node tools/catalog-smoke-test.mjs
      - name: Guardar informe de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-catalogos-supermercados
          path: catalog-smoke-test/report.json
          if-no-files-found: error
          retention-days: 14
