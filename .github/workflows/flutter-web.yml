
name: publicar-comparador-web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configurar plataforma web
        run: flutter create . --platforms web

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar aplicación web
        run: flutter build web --release --base-href /comparador/

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicación web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar aplicación
        uses: actions/deploy-pages@v4
