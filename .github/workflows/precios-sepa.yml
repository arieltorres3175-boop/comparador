name: generar-indice-precios-sepa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generar índice de precios
        run: node tools-build-index.mjs
      - name: Guardar índice como artefacto (no publicar sobre GitHub Pages)
        uses: actions/upload-artifact@v4
        with:
          name: indice-precios-sepa
          path: public
          if-no-files-found: error
          retention-days: 14
