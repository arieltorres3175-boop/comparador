name: validar-mvp-comparador

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/validate-pr.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar plataformas Android y Web
        run: flutter create . --platforms=android,web

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Compilar APK
        run: flutter build apk --release

      - name: Compilar versión web
        run: flutter build web --release --base-href /comparador/

      - name: Guardar APK de validación
        uses: actions/upload-artifact@v4
        with:
          name: comparador-mvp-apk-validacion
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
